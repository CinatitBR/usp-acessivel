name: usp_acessivel
description: "Aplicativo de mapa para tornar o campus da USP mais acessível."
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  dio: ^5.11.0
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  maplibre: ^0.3.5
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-VariableFont_wght.ttf
  assets:
    - data/
    - assets/tiles/
    - assets/rotas-odonto/
    - assets/map-icons/
    - .env.development
    - .env.production
